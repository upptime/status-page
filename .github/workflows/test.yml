name: Test CI
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
jobs:
  release:
    name: Build and test
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: 14
      - name: Install dependencies
        run: npm ci
      - name: Remove bundled npm shims (Node 14 incompatible)
        run: rm -f node_modules/.bin/npm node_modules/.bin/npx
      - name: Build TypeScript
        run: npm run build
      - name: Run tests
        run: npm run test
